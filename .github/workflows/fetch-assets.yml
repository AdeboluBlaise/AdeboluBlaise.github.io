name: fetch-assets
on:
  push:
    branches: [fetch-assets]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Tinos subsets (Times New Roman metric-compatible)
        run: |
          pip install -q fonttools brotli
          mkdir -p fonts3 src
          base=https://raw.githubusercontent.com/google/fonts/main/apache/tinos
          for f in Tinos-Regular Tinos-Italic Tinos-Bold; do curl -fsSL -o "src/$f.ttf" "$base/$f.ttf"; done
          curl -fsSL -o fonts3/LICENSE-Tinos.txt "$base/LICENSE.txt" || curl -fsSL -o fonts3/LICENSE-Tinos.txt https://www.apache.org/licenses/LICENSE-2.0.txt
          U="U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+0304,U+03B1-03C9,U+2009,U+200A,U+202F,U+2013-2014,U+2018-201F,U+2022,U+2026,U+2032-2033,U+20A6,U+20AC,U+2122,U+2190-2193,U+2212,U+2248,U+2264-2265"
          for f in Tinos-Regular Tinos-Italic Tinos-Bold; do
            pyftsubset "src/$f.ttf" --unicodes="$U" --layout-features='kern,liga,lnum,tnum,mark,mkmk,ccmp' --flavor=woff2 --output-file="fonts3/$f.woff2"
          done
          ls -la fonts3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fetch-assets
          git add fonts3
          git commit -m "Build Tinos subsets" || echo "nothing to commit"
          git push
