name: fetch-assets
on:
  push:
    branches: [fetch-assets]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build font subsets
        run: |
          pip install -q fonttools brotli
          mkdir -p fonts src
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o "src/Archivo.ttf" "$base/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          curl -fsSL -o "src/Archivo-Italic.ttf" "$base/archivo/Archivo-Italic%5Bwdth%2Cwght%5D.ttf"
          curl -fsSL -o "src/STIXTwoText.ttf" "$base/stixtwotext/STIXTwoText%5Bwght%5D.ttf"
          curl -fsSL -o "src/STIXTwoText-Italic.ttf" "$base/stixtwotext/STIXTwoText-Italic%5Bwght%5D.ttf"
          curl -fsSL -o "src/OFL-archivo.txt" "$base/archivo/OFL.txt"
          curl -fsSL -o "src/OFL-stix.txt" "$base/stixtwotext/OFL.txt"
          ls -la src
          LATIN="U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2009,U+200A,U+202F,U+2013-2014,U+2018-201F,U+2022,U+2026,U+2032-2033,U+2039-203A,U+20A6,U+20AC,U+2122,U+2190-2199,U+2212,U+2248,U+2264-2265,U+2070-209F"
          MATH="U+0020-007E,U+00A0-00FF,U+0300-036F,U+0391-03A9,U+03B1-03C9,U+03D1,U+03D5,U+03F5,U+2009,U+200A,U+202F,U+2013-2014,U+2018-201D,U+2026,U+2032-2033,U+2070-209F,U+2190-2199,U+2200-22FF,U+2A7D-2A7E"
          for f in Archivo Archivo-Italic; do
            pyftsubset "src/$f.ttf" --unicodes="$LATIN" --layout-features='kern,liga,calt,tnum,lnum,pnum,onum,case,ss01,ss02,zero,frac,sups' --flavor=woff2 --output-file="fonts/$f.woff2"
          done
          for f in STIXTwoText STIXTwoText-Italic; do
            pyftsubset "src/$f.ttf" --unicodes="$MATH" --layout-features='*' --flavor=woff2 --output-file="fonts/$f.woff2"
          done
          cp src/OFL-archivo.txt fonts/OFL-Archivo.txt
          cp src/OFL-stix.txt fonts/OFL-STIXTwo.txt
          python - <<'PY'
          from fontTools.ttLib import TTFont
          for f in ["src/Archivo.ttf", "src/STIXTwoText-Italic.ttf"]:
              t = TTFont(f)
              cmap = t.getBestCmap()
              print(f, "axes:", [(a.axisTag, a.minValue, a.maxValue) for a in t["fvar"].axes] if "fvar" in t else None)
              print("  naira", 0x20A6 in cmap, "rho", 0x03C1 in cmap, "macron-comb", 0x0304 in cmap, "minus", 0x2212 in cmap)
              feats = set()
              if "GSUB" in t:
                  for fr in t["GSUB"].table.FeatureList.FeatureRecord: feats.add(fr.FeatureTag)
              print("  GSUB features:", sorted(feats))
          PY
          ls -la fonts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fetch-assets
          git add fonts
          git commit -m "Build font subsets" || echo "nothing to commit"
          git push
