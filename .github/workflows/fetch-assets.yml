name: fetch-assets
on:
  push:
    branches: [fetch-assets]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lean font subsets
        run: |
          pip install -q fonttools brotli
          mkdir -p fonts2 src
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o src/Archivo.ttf "$base/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          curl -fsSL -o src/STIX.ttf "$base/stixtwotext/STIXTwoText%5Bwght%5D.ttf"
          curl -fsSL -o src/STIX-Italic.ttf "$base/stixtwotext/STIXTwoText-Italic%5Bwght%5D.ttf"
          # Archivo: keep only the widths and weights the site uses
          fonttools varLib.instancer src/Archivo.ttf wdth=62:100 wght=400:700 -o src/Archivo-lim.ttf
          LATIN="U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2009,U+200A,U+202F,U+2013-2014,U+2018-201F,U+2022,U+2026,U+2032-2033,U+20A6,U+20AC,U+2122,U+2190-2193,U+2212,U+2248,U+2264-2265"
          MATH="U+0020-007E,U+00A0-00FF,U+0304,U+0305,U+03B1-03C9,U+0391-03A9,U+2009,U+200A,U+202F,U+2013-2014,U+2018-201D,U+2026,U+2032,U+2070-2079,U+207A-207F,U+2212,U+2248,U+2260,U+2264-2265,U+221A,U+221E"
          pyftsubset src/Archivo-lim.ttf --unicodes="$LATIN" --layout-features='kern,liga,calt,tnum,lnum,pnum,case' --flavor=woff2 --output-file=fonts2/Archivo.woff2
          for f in STIX STIX-Italic; do
            out=STIXTwoText; [ "$f" = "STIX-Italic" ] && out=STIXTwoText-Italic
            pyftsubset "src/$f.ttf" --unicodes="$MATH" --layout-features='kern,liga,mark,mkmk,ccmp,locl,lnum,tnum,frac,sups' --flavor=woff2 --output-file="fonts2/$out.woff2"
          done
          ls -la fonts2
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin fetch-assets
          git add fonts2
          git commit -m "Build lean font subsets" || echo "nothing to commit"
          git push
